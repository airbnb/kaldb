node_metadata_tag_mapping:
  project:
    default_key:
      - service_name
    default_value: unknown_project
    use_default_key_on_empty_override: false
    rules:
      - field: operation_name
        value: http.request
        override_key:
          - tag.http.target.service
  service:
    default_key:
      - kube.app
      - kube.namespace
    default_value: unknown_service
    key_delimiter: .
    rules:
      - field: operation_name
        value: http.request
        override_key:
          - tag.http.target.host
  resource:
    default_key:
      - resource
    default_value: unknown_resource
    use_default_key_on_empty_override: false
    rules:
      - field: operation_name
        value: http.request
        override_key:
          - http.url
      - field: operation_name
        value: http.request
        override_key:
          - tag.http.target.canonical_path
edge_metadata_tag_mapping:
  operation:
    default_key:
      - operation_name
    default_value: unknown_operation
    rules: []
  product_context:
    is_annotation: true
    default_key:
      - tag.product_context_root_function
      - tag.product_context
      - tag.product_context_criticality
    key_delimiter: "|"
    default_value: ""