node_metadata_tag_mapping:
  service:
    default_key:
      - kube.app
      - kube.namespace
    default_value: unknown_service
    key_delimiter: .
    rules:
      - field: operation_name
        value: http.request
        override_key:
          - tag.http.target.host
    data_frame_field: title
  resource:
    default_key:
      - resource
    default_value: unknown_resource
    rules:
      - field: operation_name
        value: http.request
        override_key:
          - tag.http.target.canonical_path
    data_frame_field: subtitle
edge_metadata_tag_mapping:
  operation:
    default_key:
      - operation_name
    default_value: unknown_operation
    rules: []
    data_frame_field: mainstat